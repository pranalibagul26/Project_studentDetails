<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=<device-width>, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body{
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items:center;
            background-image: url("bg_image.png");
            background-size: cover;
            overflow-x: hidden;

        }

        .main_div{
            position: relative;
            margin: 10px;
            width: 95%;
            max-width: 1000px;
            backdrop-filter: blur(20px);
            /* flex-direction: column; */
            background: rgba(255, 255, 255, 0.13);
            border-radius: 25px;
            box-shadow: 0px 0px 10px white;
            padding: 40px;
        }
        .h2{
            text-align: center;
            color:rgb(209, 207, 207);
            margin-bottom: 50px;
            position: relative;
            /* border: 2px solid black; */
        
        }


        /* .welcome{
            font-size: 23px;
            color:rgb(209, 207, 207);
            width: 30%;
            /* border: 2px solid rgb(198, 197, 197);
            margin-bottom: 30px;
            padding: 0;


        }
        .username{
            font-weight: bold;
            color:rgb(171, 171, 220) ; */
        
        h2.h2{
            font-size: 2.5rem;
            background: linear-gradient(135deg, #fff, #e0e7ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-weight: 700;
            text-shadow: 0 10px 10px rgba(0, 0, 0, 0.322);
            margin-bottom: 2rem;


        }


        .form{
            display: grid;
            gap: 20px;
                     margin-bottom: 2rem;
            /* border: 2px solid rgb(255, 252, 252); */
        }

        .form_element label{
            font-size: 18px;
            color: white;
            font-weight: 200;
            margin-bottom: 5px;
            text-shadow: 0px 1px 2px rgba(0, 0, 0, 0.3);
        }

        .form_element input, 
        .form_element select{
            width: 100%;
            padding:10px;
            font-size: 16px;
            border: 1px solid rgba(255, 255, 255, 0.316);
            background-color: rgba(17, 16, 16, 0.14);
            color: rgb(229, 219, 219);
            border-radius: 12px;
            box-sizing: border-box;
            height:auto           

        }
        .form_row{
             display: grid;
             gap: 20px; /*gap between rows*/
             grid-template-columns: repeat(auto-fit, minmax(280px,1fr));
        }
        .form_element{
            display: flex;   
            flex-direction: column;

        }
        .subject_sec {
         display: flex;
          align-items: flex-start;
          padding: 8px;
          margin-bottom: 20px;
          /* border: 2px solid black; */
         gap: 8px;

        }

        .subject_label {
         font-weight: bold;
         margin-bottom: 15px;
          font-size: 18px;
          color:rgb(209, 207, 207);
          text-shadow: 0 1px 2px rgba(0, 0, 0, 0.3);
        }
        .checkbox_row {
          display: flex;
          flex-direction: column;
          gap: 10px;
          font-size: 16px;
          color:rgb(209, 207, 207);
        }

        .checkbox_row label {
         display: flex;
         /* align-items: center; */
         gap: 5px;
        }
        .statemnt{
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 20px;
            color:rgb(209, 207, 207);
        }

        .save_btn{
            width: 120px;
            padding: 12px;
            background-color: rgb(91, 91, 200);
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 16px;
            cursor: pointer;
            margin-top: 16px;
        }
 
    </style>
</head>
<body>
    <div class="main_div">
         <h2 class="h2">Student Details</h2>
         <!-- <p class="welcome"> Welcome, <span class="username">Username</span></p> -->
<!-- row 1 -->
       <form class="form">
        <div class="form_row">
        <div class="form_element">
            <label for="studentname">Student Name</label>
            <input type="text" id="studentName" name="studentname" required>
        </div>
        <div class="form_element">
            <label for="studentID">Student ID</label>
            <input type="text" id="studentID" name="studentID" required>
        </div>
        <div class="form_element">
            <label for="course">Course</label>
            <select id="course" name="course">
                <option value="Computer science" style="color: black;">Computer Science</option>
                <option value="MBA" style="color: black;">MBA</option>
                <option value="Engineering"style="color: black;" >Engineering</option>
                <option value="Agriculture" style="color: black;">Agriculture</option>
            </select>
        </div>
    </div>

       <!-- Row 2 -->
    <div class="form_row">
        <div class="form_element">
            <label for="sem">Semester</label>
            <select name="sem" id="semester">
                <option value="" style="color: black;">Select Semester</option>
                <option value="1" style="color: black;">1st Semester</option>
                <option value="2"style="color: black;" >2nd Semester</option>
                <option value="3"style="color: black;">3rd Semester</option>
                <option value="4" style="color: black;">4th Semester</option>
                <option value="5"style="color: black;" >5th Semester</option>
                <option value="6"style="color: black;">6th Semester</option>
                <option value="7"style="color: black;">7th Semester</option>
                <option value="8" style="color: black;">8th Semester</option>
            </select>
        </div>
        <div class="form_element">
            <label for="Email">Email</label>
            <input type="email" id="Email" name="Email" required>
        </div>
        <div class="form_element">
            <label for="Phone">Phone Number</label>
            <input type="tel" id="Phone" name="Phone" required>
        </div>
    </div>
    </form>
<!-- checkbox -->
<div class="subject_sec">
  <label class="subject_label">Subject</label>
  <div class="checkbox_row">
    <label><input type="checkbox" name="subject" value="SQL"> SQL</label>
    <label><input type="checkbox" name="subject" value="Java"> Java</label>
    <label><input type="checkbox" name="subject" value="Webtech"> Webtech</label>
    <label><input type="checkbox" name="subject" value="j2ee"> j2ee</label>
    <label><input type="checkbox" name="subject" value="selenium"> selenium</label>
    <label><input type="checkbox" name="subject" value="Webservice"> Web service</label>
  </div>
</div>
<div class="statemnt">
    <label for="statemnt">
        <input type="checkbox" id="confirmation"> The above information is correct</label>
</div>
            
<!-- save button -->
        <button class="save_btn" id="saveBtn">Save Details</button>
    
    </div>
<script>
   document.getElementById('saveBtn').addEventListener('click', (e) => {
        e.preventDefault(); 
      if (!document.getElementById('confirmation').checked) {
        return alert('Please confirm the info is correct.');
      }
        //get from data
        const student = {
        id :     document.getElementById('studentID').value,
        name:    document.getElementById('studentName').value,
        semester:document.getElementById('semester').value,
        email:   document.getElementById('Email').value,
        phone:   document.getElementById('Phone').value,
        subjects: Array.from(
          document.querySelectorAll('input[name="subject"]:checked')
        ).map(cb => cb.value)
        };
  
        const all = JSON.parse(localStorage.getItem('student') || '[]');
        all.push(student);
        localStorage.setItem('student', JSON.stringify(all));
        
        window.location.href ='tables.html';

    });

</script>
</body>
</html>
