<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body{
            margin: 0;
            padding: 0;
            background-image:url("bg_image.png");
            min-height: auto;
            min-height: 100vh;
            padding: 20px;
            overflow-y: hidden;
        }
        .container{
            max-width:auto;
            margin: 0 auto; 
            /* border: 2px solid white; */
             background: rgba(22, 17, 17, 0.241);
            backdrop-filter: blur(20px);
            padding: 30px;
            /* border-radius: 20px;
             box-shadow: 0px 2px 5px grey ;
             */
        }
        .header{
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 20px;
            flex-wrap: wrap;
            gap: 20px;
        }
        h1{
            color: white;
            font-size: 30px;
            margin: 0;
            text-align: center;
            
        }
        .stu_table{
            width: 100%;
            border-collapse: collapse;
            border-radius: 15px;
            overflow-x: hidden;
            box-shadow: 0px 4px 16px rgb(112, 108, 108);
        }
        th{
            color: rgb(186, 179, 179);
            padding: 10px;
            text-align: left;
            font-size: 22px;
            font-weight: lighter;
            /* border-radius: 8px; */
            background: rgba(255, 255, 255, 0.1);
            /* border-bottom: 2px solid rgb(215, 135, 135); */

        }
        td{
            padding: 15px;
            color: rgb(229, 217, 217);
            vertical-align: top;
        }
   
        .logout{
            width: 100px;
            padding: 8px;
            background-color: rgb(218, 62, 62);
            box-shadow: 2px 2px 5px red;
            color: white;
            font-weight: 400;
            border: none;
            border-radius: 4px;
            font-size: 15px;
            cursor: pointer;
            margin-top: 20px;    
        }
        .lgo_container{
            position: absolute;
            top: 20px;
            right:20px
        }
        .logout:hover{
            background-color: #7e2f2f;
        }
        .pagination_con{
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
            flex-wrap: wrap;
            margin-top: 30px;
        }
        .pagination_btn{
            width: 50px;
            height: 50px;
            font-size: 16px;
            color: white;
            background: rgba(255, 255, 255, 0.15);
            border-radius: 15px;
        }
        /* responsive */
        @media (max-width: 768px) {
    h1 {
        font-size: 24px;
    }

    th, td {
        font-size: 14px;
        padding: 10px;
    }

    .pagination_btn {
        width: 40px;
        height: 40px;
        font-size: 14px;
    }

    .logout {
        width: 80px;
        padding: 6px;
        font-size: 13px;
    }

    .lgo_container {
        top: 10px;
        right: 10px;
    }
}
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Student Details Table</h1>
        </div>
        

        <div class="table_container">
            <table class="stu_table" id="studentTable">
                <thead>
                    <tr>
                        <th>Student ID</th>
                        <th>Student Name</th>
                        <th>Semester</th>
                        <th>Email</th>
                        <th>Phone no.</th>
                        <th>subject</th> 
                               
                    </tr>
                </thead>                        
                <tbody id="studentTableBody">
                    <!-- data -->
                </tbody>
            </table>
            
        </div>  
        <div class="pagination_con">
            <button class="pagination_btn" id="prevBtn" onclick="previousPage()"><</button>
            <button class="pagination_btn" id="nextBtn" onclick="nextPage()" >></button>
        </div>
        
        <div class="lgo_container">
        <button class="logout" onclick="location.href='index.html'">Log out</button>
       </div>                
    </div>
    <script>

    const students = JSON.parse(localStorage.getItem('student')) || [];
    const rowsPerPage = 10;
    let currentPage = 1;

    function renderTable() {
      const tbody = document.getElementById('studentTableBody');
      tbody.innerHTML = '';

      const startIndex = (currentPage - 1) * rowsPerPage;
      const endIndex = startIndex + rowsPerPage;
      const paginatedStudents = students.slice(startIndex, endIndex);

      paginatedStudents.forEach(student => {
        const tr = document.createElement('tr');
        [
          student.id,
          student.name,
          student.semester,
          student.email,
          student.phone,
          student.subjects.join(', ')
        ].forEach(text => {
          const td = document.createElement('td');
          td.textContent = text;
          tr.appendChild(td);
        });
        tbody.appendChild(tr);
      });

      document.getElementById('prevBtn').disabled = currentPage === 1;
      document.getElementById('nextBtn').disabled = endIndex >= students.length;
    }

    function nextPage() {
      currentPage++;
      renderTable();
    }

    function previousPage() {
      currentPage--;
      renderTable();
    }

    // Initial table render
    renderTable();
    </script>
</body>
</html>
