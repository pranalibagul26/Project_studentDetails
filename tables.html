<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body{
            margin: 0;
            padding: 0;
            background-image:url("bg_image.png");
            min-height: 100vh;
            padding: 20px;
        }
        .container{
            max-width: 1000px;
            margin: 0 auto;
            /* border: 2px solid white; */
            background: rgba(22, 17, 17, 0.241);
            backdrop-filter: blur(20px);
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0px 2px 5px grey ;
            
        }
        .header{
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 20px;
            flex-wrap: wrap;
            gap: 20px;
        }
        h1{
            color: white;
            font-size: 30px;
            margin: 0;
            text-align: center;
            
        }
        .stu_table{
            width: 100%;
            border-collapse: collapse;
            border-radius: 10px;
            box-shadow: 0px 4px 16px rgb(112, 108, 108);
        }
        th{
            color: rgb(186, 179, 179);
            padding: 10px;
            text-align: left;
            font-size: 22px;
            font-weight: lighter;
            /* border-bottom: 2px solid rgb(215, 135, 135); */

        }
        td{
            padding: 15px;
            color: rgb(229, 217, 217);
            vertical-align: top;
        }

        .logout{
            width: 100px;
            padding: 8px;
            background-color: rgb(218, 62, 62);
            box-shadow: 2px 2px 5px red;
            color: white;
            font-weight: 400;
            border: none;
            border-radius: 4px;
            font-size: 15px;
            cursor: pointer;
            margin-top: 20px;    
        }
        .lgo_container{
            position: absolute;
            top: 10px;
            right:15px
        }
        .logout:hover{
            background-color: #7e2f2f;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Student Details Table</h1>
        </div>
        

        <div class="table_container">
            <table class="stu_table" id="studentTable">
                <thead>
                    <tr>
                        <th>Student ID</th>
                        <th>Student Name</th>
                        <th>Semester</th>
                        <th>Email</th>
                        <th>Phone no.</th>
                        <th>subject</th> 
                               
                    </tr>
                </thead>                        
                <tbody id="studentTableBody">
                    <!-- data -->
                </tbody>
            </table>
            <div class="lgo_container">
        <button class="logout" onclick="location.href='index.html'">Log out</button>
       </div>
        </div>                    
    </div>
    <script>

        const student = JSON.parse(localStorage.getItem('student'));
        const tbody = document.getElementById('studentTableBody');

        student.forEach(element => {
            const tr = document.createElement('tr');
            [
                element.id,
                element.name,
                element.semester,
                element.email,
                element.phone,
                element.subjects.join(',')
            ].forEach(text => {
                const td = document.createElement('td');
                td.textContent = text;
                tr.appendChild(td);
            });
            tbody.appendChild(tr);
        });
    </script>
</body>
</html>
