<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body{
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-image: url("background.jpg");
        }
        .container{
            padding: 20px;
            box-shadow: 0px 0px 10px black;
            background-color: rgba(0, 0, 0, 0.536);
            width: 100%;
            max-width: 350px;
        }
        input{
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            border-radius: 4px;
            border: 1px solid white;
            box-sizing: border-box;
            color: aliceblue;
            background-color: rgba(0, 0, 0, 0.367);
            font-size: 16px;

        }

        button{
            width: 100%;
            padding: 12px;
            background-color: rgb(74, 74, 125);
            color: aliceblue;
            text-decoration: none;
            border: none;
            border-radius: 4px;
            font-size: 16px;
            cursor: pointer;
            margin-top: 16px;
            align-self: center;
        }
        button:hover {
            background-color: rgb(71, 71, 180);
            color: white;
        }
    </style>
</head>
<body>
    <div class="container">
        <form id="resetForm">
            <input type="email" placeholder="Email" id="email" required>
            <input type="password" placeholder="Current Password" id="currentPassword" required>
            <input type="password" placeholder="New password" id="newPassword" required>
            <button type="submit" onclick="location.href='index.html'">Reset Password</button>
        </form>
    </div>

</body>
</html>
